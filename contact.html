<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC Connects</title>
    <link rel="stylesheet" href="css/common.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .gradient-text {
        font-weight: 700;
        font-size: 45px;
        background: linear-gradient(to right, #1a3b6e, #1c4b94, #007bdf);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
      }

      .contact-container {
        max-width: 960px;
        margin: 0 auto;
        padding: 0px 20px 60px;
        font-family: "Poppins", sans-serif;
      }

      .contact-form-section {
        max-width: 1100px;
        margin: 0 auto;
      }
      .contact-form-section h1 {
        text-align: center;
        margin-bottom: 50px;
      }

      .contact-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 20px;
      }

      .form-row.full-width {
        flex-direction: column;
      }

      .form-group {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
      }

      .form-group label {
        font-weight: 500;
        margin-bottom: 12px;
        font-size: 20px;
        color: #1a3b6e;
      }

      .form-group input,
      .form-group textarea {
        padding: 12px;
        font-size: 15px;
        border: 1px solid #aab4c3;
        border-radius: 6px;
        font-family: inherit;
      }

      .submit-btn {
        background-color: #007bdf;
        color: #fff;
        padding: 14px 28px;
        border: none;
        border-radius: 6px;
        font-size: 23px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 10px
      }

      .submit-btn:hover {
        background-color: #005fa3;
      }

      @media (min-width: 959px) {
        .news-date-box {
          position: relative;
          left: 50%;
          transform: translateX(360px);
        }

        .header-inner {
          display: flex;
          align-items: center;
          justify-content: space-between;
          max-width: 1440px;
          margin: 0 auto;
          /* padding: 0 40px; */
          gap: 20px;
        }

        nav {
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
          position: static !important;
          transform: none !important;
          margin-left: 0;
        }

        nav ul {
          display: flex !important;
          gap: 24px;
          justify-content: center;
          align-items: center;
          padding: 0;
          margin: 0;
          list-style: none;
        }

        nav ul li a {
          display: block;
          padding: 10px 15px;
          font-weight: 500;
          /* color: black; */
          text-decoration: none;
        }

        nav ul li a:hover {
          color: #0071ce;
        }
        .hidden {
          display: none;
        }
      }

      @media (max-width: 958px) {
        .form-row {
          flex-direction: column;
        }

        .submit-btn {
          width: 100%;
          text-align: center;
        }

        .contact-container {
          padding: 50px 20px 50px 20px;
        }
      }

      @media (max-width: 480px) {
        .gradient-text {
          font-size: 28px;
          line-height: 1.4;
        }

        .form-group input,
        .form-group textarea {
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Header 영역 불러오기 -->
    <div id="header-include"></div>

    <section id="banner">
      <div class="banner-inner">
        <img src="images/BG Image/BG Image_06 Connect.png" alt="Banner" />
        <div class="hero-text">
          <h1>Connect Us</h1>
        </div>
      </div>
    </section>

    <form id="contact-form" class="contact-form">
    <main class="contact-container">      
        <section class="contact-form-section">
          <h1>
            <span class="gradient-text"
              >How Can We Help You Connect&nbsp;?</span
            >
          </h1>
          <form class="contact-form">
            <div class="form-row">
              <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" required />
              </div>
              <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required />
              </div>
              <div class="form-group">
                <label for="contact-number">Contact Number</label>
                <input type="tel" id="contact-number" name="contact-number" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="job-title">Job Title</label>
                <input type="text" id="job-title" name="job-title" />
              </div>
              <div class="form-group">
                <label for="company-name">Company Name</label>
                <input type="text" id="company-name" name="company-name" />
              </div>
            </div>
            <div class="form-row full-width">
              <div class="form-group">
                <label for="message">Message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="5"
                  required
                ></textarea>
              </div>
            </div>
            <!-- Formspree 스팸 방지용 필드 (bot이 자동 작성하는 필드를 숨김 처리) -->
            <input type="text" name="_gotcha" style="display: none" />
            <div class="form-row full-width">
              <button type="submit" class="submit-btn">Submit</button>
            </div>
          </form>
        </section>
      </form>
    </main>

    <!-- Footer 영역 불러오기 -->
    <div id="footer-include"></div>
    <script src="js/include.js"></script>
    <script>
      /* Base scripts and layout logic for all pages */
      let resizeTimeout;
      let mobileDropdownInitialized = false;
      /* Responsive footer font and image size for under 958px */
      // Move nav inside .header-inner on desktop, outside on mobile
      function adjustNavPosition() {
        const headerInner = document.querySelector(".header-inner");
        const nav = document.querySelector("nav");
        if (!headerInner || !nav) return;
        if (window.innerWidth > 958) {
          if (!headerInner.contains(nav)) {
            headerInner.appendChild(nav);
          }
        } else {
          if (headerInner.contains(nav)) {
            headerInner.parentNode.parentNode.insertBefore(
              nav,
              headerInner.parentNode.nextSibling
            );
          }
        }
      }

      function enableMobileDropdown() {
        if (window.innerWidth > 958) {
          // Remove any existing onclick handlers to avoid conflicts on desktop
          document.querySelectorAll("nav ul li > a").forEach((link) => {
            link.onclick = null;
            link.classList.remove("open");
            if (link.parentElement) {
              link.parentElement.classList.remove("open");
            }
          });
          mobileDropdownInitialized = false;
          return;
        }

        if (mobileDropdownInitialized) return; // Prevent re-initialization

        const allMenuLinks = document.querySelectorAll("nav ul li > a");
        allMenuLinks.forEach((link) => {
          link.onclick = (e) => {
            const parent = link.parentElement;
            const isDropdown = parent.classList.contains("dropdown");
            const isOpen = parent.classList.contains("open");

            // Prevent default only for dropdowns
            if (isDropdown) {
              e.preventDefault();
            }

            // Reset all menu states
            document.querySelectorAll("nav ul li").forEach((item) => {
              item.classList.remove("open");
              const aTag = item.querySelector("a");
              if (aTag) {
                aTag.classList.remove("open");
              }
            });

            // Toggle dropdown only if it's a dropdown and was not already open
            if (isDropdown && !isOpen) {
              parent.classList.add("open");
              link.classList.add("open");
            } else if (!isDropdown) {
              // Close mobile menu if non-dropdown clicked
              document.body.classList.remove("menu-open");
            }
          };
        });
        mobileDropdownInitialized = true;
      }

      function onResize() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          adjustNavPosition();
          enableMobileDropdown();
        }, 150);
      }

      const form = document.getElementById("contact-form");

      form.addEventListener("submit", async function (event) {
        event.preventDefault(); // 기본 제출 막기

        // Manually construct FormData with combined message
        const formData = new FormData();

        const firstName = document.getElementById("first-name").value.trim();
        const lastName = document.getElementById("last-name").value.trim();
        const email = document.getElementById("email").value.trim();
        const contactNumber = document.getElementById("contact-number").value.trim();
        const jobTitle = document.getElementById("job-title").value.trim();
        const companyName = document.getElementById("company-name").value.trim();
        const userMessage = document.getElementById("message").value.trim();

        const combinedMessage = `
                                    Name: ${firstName} ${lastName}
                                    Email: ${email}
                                    Contact Number: ${contactNumber}
                                    Job Title: ${jobTitle}
                                    Company Name: ${companyName}

                                    Message:
                                    ${userMessage}
                                    `.trim();

        formData.append("email", email); // So Formspree can reply
        formData.append("message", combinedMessage);

        try {
          const response = await fetch("https://formspree.io/f/mjkrzdbv", {
            method: "POST",
            headers: { Accept: "application/json" },
            body: formData,
          });

          if (response.ok) {
            alert("성공적으로 전송되었습니다. 감사합니다!");
            form.reset();
          } else {
            alert("전송 중 문제가 발생했습니다. 다시 시도해주세요.");
          }
        } catch (error) {
          alert("에러 발생: " + error.message);
        }
      });

      window.addEventListener("load", () => {
        adjustNavPosition();
        enableMobileDropdown();
      });

      window.addEventListener("resize", onResize);
    </script>
  </body>
</html>
