<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC Connects</title>
    <link rel="stylesheet" href="css/common.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .news-detail-section {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
        font-family: "Poppins", sans-serif;
        line-height: 1.6;
      }

      .news-detail-header {
        text-align: left;
        margin-bottom: 20px;
      }

      .news-date-box {
        background: #0071ce;
        color: white;
        text-align: center;
        padding: 20px 24px;
        display: inline-block;
        margin: 100px auto 0;
      }

      .news-date-box .date-month {
        font-size: 18px;
        font-weight: bold;
      }

      .news-date-box .date-day {
        font-size: 36px;
        font-weight: bold;
      }

      .news-date-box .date-year {
        font-size: 16px;
      }

      .news-type {
        color: #0071ce;
        font-size: 14px;
        margin-top: 10px;
      }

      .news-title {
        font-size: 22px;
        font-weight: bold;
        margin-top: 5px;
      }

      .news-detail-meta {
        display: flex;
        justify-content: space-between;
        margin: 50px 0;
      }

      .news-meta-left,
      .news-meta-right {
        height: 32px;
      }

      .news-detail-body p {
        margin-bottom: 20px;
      }

      .news-detail-body a {
        color: #0071ce;
        text-decoration: underline;
        white-space: normal;
        word-wrap: break-word;
        word-break: break-word;
      }

      @media (min-width: 959px) {
        .news-date-box {
          position: relative;
          left: 50%;
          transform: translateX(360px);
        }

        .header-inner {
          display: flex;
          align-items: center;
          justify-content: space-between;
          max-width: 1440px;
          margin: 0 auto;
          padding: 0 40px;
          gap: 20px;
        }

        nav {
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
          position: static !important;
          transform: none !important;
          margin-left: 0;
        }

        nav ul {
          display: flex !important;
          gap: 24px;
          justify-content: center;
          align-items: center;
          padding: 0;
          margin: 0;
          list-style: none;
        }

        nav ul li a {
          display: block;
          padding: 10px 15px;
          font-weight: 500;
          color: black;
          text-decoration: none;
        }

        nav ul li a:hover {
          color: #0071ce;
        }
        .hidden {
          display: none;
        }
      }

      @media (max-width: 958px) {
        .news-date-box {
          display: block;
          margin: 10px auto 0;
          transform: none;
          left: auto;
        }
      }
    </style>
  </head>

  <body>
    <!-- Header 영역 불러오기 -->
    <div id="header-include"></div>

    <div class="news-date-box">
      <div id="date-month" class="date-month"></div>
      <div id="date-day" class="date-day"></div>
      <div id="date-year" class="date-year"></div>
    </div>

    <!-- News Detail Section -->
    <section class="news-detail-section">
      <div class="news-detail-wrapper">
        <div class="news-detail-header">
          <div class="news-type">NEWS</div>
          <h2 id="news-title" class="news-title"></h2>
        </div>

        <div class="news-detail-meta">
          <img
            src="images/Company CI/DCC CI Full_Main Color.png"
            alt="DCC Connects"
            class="news-meta-left"
          />
          <img
            src="images/Company CI/LinkedIn Png.png"
            alt="LinkedIn"
            class="news-meta-right"
          />
        </div>

        <div id="news-detail-body" class="news-detail-body"></div>
      </div>
    </section>

    <!-- Footer 영역 불러오기 -->
    <div id="footer-include"></div>
    <script src="js/include.js"></script>
    <script>
      /* Base scripts and layout logic for all pages */
      let resizeTimeout;
      let mobileDropdownInitialized = false;
      /* Responsive footer font and image size for under 958px */
      // Move nav inside .header-inner on desktop, outside on mobile
      function adjustNavPosition() {
        const headerInner = document.querySelector(".header-inner");
        const nav = document.querySelector("nav");
        if (!headerInner || !nav) return;
        if (window.innerWidth > 958) {
          if (!headerInner.contains(nav)) {
            headerInner.appendChild(nav);
          }
        } else {
          if (headerInner.contains(nav)) {
            headerInner.parentNode.parentNode.insertBefore(
              nav,
              headerInner.parentNode.nextSibling
            );
          }
        }
      }

      function enableMobileDropdown() {
        if (window.innerWidth > 958) {
          // Remove any existing onclick handlers to avoid conflicts on desktop
          document.querySelectorAll("nav ul li > a").forEach((link) => {
            link.onclick = null;
            link.classList.remove("open");
            if (link.parentElement) {
              link.parentElement.classList.remove("open");
            }
          });
          mobileDropdownInitialized = false;
          return;
        }

        if (mobileDropdownInitialized) return; // Prevent re-initialization

        const allMenuLinks = document.querySelectorAll("nav ul li > a");
        allMenuLinks.forEach((link) => {
          link.onclick = (e) => {
            const parent = link.parentElement;
            const isDropdown = parent.classList.contains("dropdown");
            const isOpen = parent.classList.contains("open");

            // Prevent default only for dropdowns
            if (isDropdown) {
              e.preventDefault();
            }

            // Reset all menu states
            document.querySelectorAll("nav ul li").forEach((item) => {
              item.classList.remove("open");
              const aTag = item.querySelector("a");
              if (aTag) {
                aTag.classList.remove("open");
              }
            });

            // Toggle dropdown only if it's a dropdown and was not already open
            if (isDropdown && !isOpen) {
              parent.classList.add("open");
              link.classList.add("open");
            } else if (!isDropdown) {
              // Close mobile menu if non-dropdown clicked
              document.body.classList.remove("menu-open");
            }
          };
        });
        mobileDropdownInitialized = true;
      }

      function onResize() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          adjustNavPosition();
          enableMobileDropdown();
        }, 150);
      }

      function showNewsDetail(id) {
        const detailMap = {
          n1: {
            title: `DC Connects Opens Official LinkedIn Page to Share Insights, Updates,
            and Build Community Connections`,
            date_year: "2025",
            date_month: "JUL",
            date_day: "25",
            content: `
                <p>
                DC Connects is excited to announce the launch of its official LinkedIn page, marking a new chapter in how the company engages with industry professionals, clients, and partners.
            </p>
            <p>
                This platform will serve as a hub for sharing expert insights, project milestones, and the latest updates from across the data center and infrastructure sectors.
            </p>
            <p>
                As part of its mission to foster transparent communication and community growth, DC Connects invites you to follow its page and become part of the conversation.
            </p>
            <p>
                Whether you’re interested in cutting-edge engineering developments, sustainability in data center design, or updates on key project deployments, the page promises valuable content for all stakeholders.
            </p>
            <p>
                Follow us at: https://www.linkedin.com/in/dcconnects
                <br />
                <a
                href="https://www.linkedin.com/in/dcconnects"
                target="_blank"
                >https://www.linkedin.com/in/dcconnects
                </a>
            </p>
            <p>
                Stay connected, stay informed, and grow with us.
                </p>
            `,
          },
          n2: {
            title: `DC Connects Secures Construction Permit for First Data Center
            Project ‘Soul 01’ in Yongin, South Korea, with 56MW IT Capacity`,
            date_year: "2025",
            date_month: "AUG",
            date_day: "01",
            content: `
                <p>
                Yongin, South Korea — DCC has officially permitted construction on
                its inaugural data center project, Soul 01, located in Cheoin-gu,
                Yongin, a strategic location just outside of Seoul.
            </p>
            <p>
                The facility is designed to support 56MW of IT load, with two
                purpose-built buildings delivering 28MW each, and a total gross
                floor area (GFA) of 57,971 square meters.
            </p>
            <p>
                Positioned to meet the growing demand for cloud and AI
                infrastructure, Soul 01 marks a major milestone in DCC’s expansion
                into hyperscale-grade data center development. The project is
                tailored for high-density workloads, ensuring scalability and
                efficiency for next-generation computing.
            </p>
            <p>
                Construction is already underway, with full delivery targeted for Q1
                2028. The development is expected to serve leading hyperscale,
                cloud, and enterprise clients looking to expand their presence in
                the Greater Seoul Metropolitan Area—one of Asia’s most active
                digital markets.
            </p>
            <p>
                “Our mission is to deliver resilient, future-proof data center
                solutions that meet the needs of AI and cloud-based innovation,”
                said a DCC CEO. “Soul 01 is just the beginning.”
            </p>
            <p>
                For more details on this project, please visit:
                <br />
                <a
                href="https://www.dcconnects.com/datacenters/kor/soul01"
                target="_blank"
                >https://www.dcconnects.com/datacenters/kor/soul01
                </a>
            </p>
            `,
          },
          n3: {
            title: `DC Connects Joins Warburg Pincus and Wide Creek to Launch 80 MW Hyper‑Scale Data Center in Greater Seoul`,
            date_year: "2025",
            date_month: "SEP",
            date_day: "24",
            content: `
                <p>
                    Founded by Jae Woo Choi, formerly of Brookfield’s DCI Data Centers, 
                    DC Connects aims to meet fast-growing demand for digital infrastructure 
                    in South Korea with this Greater Seoul venture representing its first project. 
                </p>
                <p>
                    “We are proud to break ground on a strategic asset designed from the ground up 
                    to meet growing demand from global and local cloud and AI leaders,” 
                    Choi said. “With 80MW of capacity, best-in-class cooling and power systems, 
                    and built-in flexibility for rapid deployment, this data centre will deliver 
                    the reliability, efficiency, and high-density capabilities that 
                    tenants need to operate at scale.”
                </p>
                <p>
                    <b>Read more from various media outlets :</b>
                    <br/>
                    - Mingtiandi, 24 Sep 2025, <a
                    href="https://www.mingtiandi.com/real-estate/data-centres/warburg-pincus-jv-buys-site-for-80mw-greater-seoul-data-centre/"
                    target="_blank"
                    >Warburg Pincus Buys Site for 80MW Greater Seoul Data Centre
                    </a>
                    <br/>
                    - W.Media, 25 Sep 2025, <a
                    href="https://w.media/warburg-pincus-dc-connects-and-wide-creek-amc-acquire-land-for-80mw-hyperscale-dc-in-south-korea/"
                    target="_blank"
                    >Warburg Pincus, DC Connects, and Wide Creek AMC acquire land for 80MW Hyperscale DC in South Korea
                    </a>
                    <br/>
                    - Institutional Real Estate, 25 Sep 2025, <a
                    href="https://irei.com/news/warburg-pincus-partners-with-dc-connects-and-wide-creek-amc-to-acquire-land-to-develop-data-center-in-south-korea/"
                    target="_blank"
                    >Warburg Pincus partners with DC Connects and Wide Creek AMC to acquire land to develop data center in South Korea
                    </a>
                    <br/>
                    - DatacenterDynamics, 25 Sep 2025, <a
                    href="https://www.datacenterdynamics.com/en/news/warburg-pincus-and-partners-break-ground-on-80mw-data-center-in-south-korea/"
                    target="_blank"
                    >Warburg Pincus and partners break ground on 80MW data center in South Korea
                    </a>
                    <br/>
                    - Telcompaper, 26 Sep 2025, <a
                    href="https://www.telecompaper.com/news/warburg-pincus-acquires-seoul-site-for-80-mw-data-centre--1549174"
                    target="_blank"
                    >Warburg Pincus acquires Seoul site for 80 MW data centre
                    </a>
                    <br/>
                    - The Tech Capital, 29 Sep 2025, <a
                    href="https://thetechcapital.com/warburg-pincus-to-develop-80mw-data-centre-in-south-korea/"
                    target="_blank"
                    >Warburg Pincus to develop 80MW data centre in South Korea
                    </a>
                </p>
                `,
          },
        };

        const detail = detailMap[id];
        if (!detail) return;

        document.querySelector("#news-title").innerText = detail.title;
        document.querySelector("#date-year").innerText = detail.date_year;
        document.querySelector("#date-month").innerText = detail.date_month;
        document.querySelector("#date-day").innerText = detail.date_day;
        document.querySelector("#news-detail-body").innerHTML = detail.content;
      }

      window.addEventListener("load", () => {
        adjustNavPosition();
        enableMobileDropdown();
      });

      window.addEventListener("resize", onResize);

      window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const newsId = params.get("id"); // 예: 'news1'
        if (newsId) {
          showNewsDetail(newsId);
        }
      });
    </script>
  </body>
</html>
